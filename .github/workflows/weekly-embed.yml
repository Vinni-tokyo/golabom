# 골라보셈 매주 재생 점검 — 보고만 한다(11-10 바뀜 · DEV_RULES §5-1).
# 걸린 YouTube 영상 전부를 퍼 가기 화면에 띄워(tools/embed_sweep.sh) 「새 막힘 · 풀림 후보」 요약과 판정 원문(all.txt 등)을 아티팩트로 남긴다.
# 빌드·커밋·푸시는 하지 않는다. 실행기는 미국에 있어 미국 지역 제한까지 「막힘」으로 본다(11-08 실행: 새 막힘 60편 중 52편이 한국에선 재생됨).
# 반영은 사람이: 월요일에 보고를 읽고 → 로컬 PC 에서 다시 확인(출구 나라 기록 · 한·일 둘 다 막힐 때만 뺌) → data/embed_blocked.json → 빌드 → §5 체크리스트.
name: weekly-embed-check

on:
  schedule:
    - cron: '0 18 * * 0'      # 매주 월요일 한국·일본 시간 오전 3시(일요일 18:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embed-check
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 브라우저 준비(Playwright)
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: 재생 점검(보고만 · embed_blocked.json 은 고치지 않음)
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          bash tools/embed_sweep.sh --country US --report .scout/sweep/report.md
          cat .scout/sweep/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: 판정 원문·보고 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embed-check-${{ github.run_id }}
          path: |
            .scout/sweep/report.md
            .scout/sweep/all.txt
            .scout/sweep/out_*.txt
            .scout/sweep/ids_*.txt
          retention-days: 30
