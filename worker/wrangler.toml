# 골라봄 검색 중계 — 배포: (worker/ 에서) npx wrangler deploy
# 키는 여기에 쓰지 않는다. 「지금 갱신」(POST /refresh) 열쇠도 비밀값 REFRESH_TOKEN 으로만 둔다. Cloudflare 대시보드 → Workers → golabom-search → Settings → Variables and Secrets 에서
# 비밀값 YT_API_KEY 로 등록한다(검색 전용 키 golabom-search, YouTube Data API v3 만 허용).
name = "golabom-search"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://vinni-tokyo.github.io,http://localhost:*,http://127.0.0.1:*,http://172.*"
DAILY_CAP = "70"          # 새 검색 하루 상한. search.list 는 하루 100회 따로 셈(2026-10-15~). 아침 GitHub 작업이 나눠 받기로 약 20회 → 나머지 70(여유 10)
PER_USER = "10"           # 한 사람(IP 해시)당 하루 새 검색
THREAD_CAP = "250"        # 실타래 파기 하루 상한(최대 약 19단위씩 ≈ 4,750단위 · search.list 는 안 씀)
THREAD_PER_USER = "60"    # 한 사람당 하루 실타래 파기

[triggers]
crons = ["35 * * * *"]    # 1시간마다 지금 뜨는 영상(분야 11 + 나라 8 = 19곳 × 1단위)을 KV 에 채운다

[[kv_namespaces]]
binding = "SEARCH_CACHE"
id = "2981db79e95e44538c18043ae4322dac"   # npx wrangler kv namespace create SEARCH_CACHE 로 만듦(10-30)
