# 골라봄 검색 중계 — 배포: (worker/ 에서) npx wrangler deploy
# 키는 여기에 쓰지 않는다. Cloudflare 대시보드 → Workers → golabom-search → Settings → Variables and Secrets 에서
# 비밀값 YT_API_KEY 로 등록한다(검색 전용 키 golabom-search, YouTube Data API v3 만 허용).
name = "golabom-search"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://vinni-tokyo.github.io,http://localhost:*,http://127.0.0.1:*,http://172.*"
DAILY_CAP = "40"          # 새 검색 하루 상한(1번 ≈ 102단위). 매일 자동 작업 ~5,100단위를 남긴다

[[kv_namespaces]]
binding = "SEARCH_CACHE"
id = "TO_BE_CREATED"      # npx wrangler kv namespace create SEARCH_CACHE 의 결과로 바꾼다
