<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)">
<title>골라봄</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
.gate{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.gate form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:var(--shadow)}
.gate .t{font-size:17px;font-weight:700;margin:0 0 4px}.gate .s{font-size:12.5px;color:var(--ink-3);margin:0 0 18px}
.gate .hint{margin:0 0 16px;padding:10px 12px;border-radius:9px;background:var(--bg);border:1px dashed var(--line-2);font-size:13.5px}
.gate input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line-2);border-radius:9px;font-size:15px;background:var(--bg);color:var(--ink)}
.gate button{width:100%;height:44px;margin-top:12px;border:0;border-radius:9px;background:var(--brand);color:var(--brand-ink);font-weight:700}
.gate .err{margin:10px 0 0;font-size:12.5px;color:var(--accent);min-height:1.3em}
</style>
</head><body>
<div class="gate" id="gate" hidden>
 <form id="gateForm" autocomplete="on">
  <p class="t">골라봄</p>
  <p class="s">테스트 중인 서비스예요. 비밀번호를 넣어 주세요.</p>
  <p class="hint">비번은 <b>12345</b>예요.</p>
  <input type="password" id="gatePw" aria-label="비밀번호" autocomplete="current-password" autofocus>
  <button type="submit">열기</button>
  <p class="err" id="gateErr"></p>
 </form>
</div>
<main id="app"></main>
<script src="gate.js"></script>
<script type="module" src="app.js"></script>
</body></html>
